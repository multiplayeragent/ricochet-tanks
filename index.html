<style>

  .card h2 { margin: 0 0 4px; font-size: 28px; color: #ffd166; } .card h3 { margin: 14px 0 4px; font-size: 13px; color: #8fd8ff; text-align: left; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }

  .card li span { float: right; font-variant-numeric: tabular-nums; opacity: .85; } .card li.me { color: #ffd166; font-weight: 700; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .75; }

  #fire { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 30px); width: 96px; height: 96px; border-radius: 50%;
          border: 3px solid #ffffff88; background: #ff5d5d66; color: #fff; font: 900 16px system-ui, sans-serif; touch-action: none; }
  #fire.on { filter: brightness(1.7); }

    .pc .pw { position: absolute; top: -4px; right: -3px; margin: 0; padding: 0 4px; border-radius: 7px; background: #000; font-size: 10px; line-height: 14px; } }

<body>

<div id="over" hidden><div class="card">

  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ RICOCHET TANKS · a Multiplayer Agent starter ════════════════════════════════════
 * Tiny tanks in a maze. Shells bounce off the walls (and can come back for you). Last tank
 * rolling takes the round, every round is a new maze, first to 5 wins the match.
 * Versus, 2–6 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ rounds, tank speed, shells, power-ups, bots
 *   MAZE .......... the seeded maze, its walls, and the ray cast every shell flies along
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   TANKS ......... driving, bumping walls, firing (the same code for people and bots)
 *   SHELLS ........ shells and lasers in flight on every screen, and who they hit
 *   BOTS .......... the bot brain: drive the maze, line up straight or bank shots, dodge
 *   MATCH (HOST) .. seats, rounds, who is out, the winner, power-ups. Only the host writes these.
 *   ME ............ my controls, my shots, picking up power-ups, my own death
 *   VIEWS ......... everyone else, eased toward their latest state
 *   DRAW .......... floor, walls, tread marks, tanks, shells, lasers, sparks
 *   HUD & RESULTS . player cards, banners, results, leaderboard, sounds
 *   INPUT ......... keyboard, and a thumb stick with a Fire button on touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each tank writes its OWN entity: `p` (one packed JSON field: round, position, angle,
 *     power-up, shield, out + who got it) about 15 times a second, `hb` (heartbeat) once a
 *     second, `n`/`c` (name, color) once.
 *   - Shots are events: "shot" {by, r, s: [[id, x, y, angle, kind]]}. A shell's whole bouncing
 *     path follows from where it started and the maze, so every screen flies the same shell.
 *   - A HIT IS DECIDED BY THE ONE IT HITS: only you check shells against your own tank. Hit with
 *     a shield up, the shield pops; otherwise you're out and your `p` says who did it. Either
 *     way you send "pop" {id} so the shell vanishes everywhere. On other screens a shell that
 *     touches a tank hides for a moment and waits for that "pop"; if none comes (on their screen
 *     it missed) it flies on. A laser beam goes through every tank on its path, so it sends no
 *     "pop". (The host decides all this for bots.)
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields:
 *       `match` {id, v, phase: intro|fight|end|over, round, seed, seats, names, wins, kills,
 *                out, ko, startAt, endsAt, lastAt, itemAt, rw, winner}
 *       `items` {r, a: [[id, x, y, kind]]}: power-ups lying in the maze
 *       `bots`  the bots' tanks, about 10 times a second
 *     The maze and the spawn points come from match.seed, so it never sends the maze itself.
 *   - Intents to the host: "pick" {id, r} (I drove over a power-up), "again" (Play again).
 *     The host answers "got" {to, k, r}: the power-up is yours.
 *   - A host whose tab froze or went to the background (a frame gap over 1s) stops hosting, waits
 *     700ms for fresh state, then adopts it like a newly elected host: it never writes its stale copy.
 *   - Someone who joins mid-round watches, then takes a bot's seat at the next round.
 *   - ?attract plays offline with five bots (the preview video is recorded from it).
 *   - Leaderboard "tank-wins": +1 for every match you win, shown on the results card.
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  winRounds: 5,          // round wins to take the match
  seats: 4,              // bots fill the match up to this many tanks (people can push it to maxSeats)
  maxSeats: 6,           // most tanks in one match
  introMs: 1800,         // "ROUND 2" before the tanks can move
  roundMs: 75000,        // a round still going after this long is a draw
  lastStandMs: 1400,     // once one tank is left, wait this long (a shell may still be bouncing) before calling it
  endMs: 2400,           // the round-winner banner
  resultsMs: 9000,       // the results card before the next match
  seatGraceMs: 6000,     // a player silent this long is out of the round (a bot takes the seat next round)
  cols: 9, rows: 6,      // maze size in cells
  cell: 80,              // px per cell (the world is cols*cell × rows*cell)
  openness: 0.32,        // share of inner walls knocked out after the maze is carved (more = more open)
  tankSpeed: 125,        // px/s forward (backing up is 65% of this)
  turnSpeed: 3.6,        // rad/s
  tankR: 14,             // tank radius
  shellSpeed: 235,       // px/s
  shellLife: 6,          // seconds a shell keeps bouncing
  shellR: 3.5,           // shell radius
  maxShells: 5,          // a tank's shells on screen at once
  fireEvery: 0.22,       // seconds between shots
  fireBuffer: 0.25,      // seconds a Fire press waits for the reload, so quick taps are not lost
  selfGrace: 30,         // px a shell must travel before it can hit the tank that fired it
  hitWaitMs: 250,        // a shell touching someone else's tank hides this long, waiting for their screen to call the hit
  laserLen: 1500,        // px a laser beam reaches, bounces included
  laserMs: 380,          // how long the beam shows (it hits in the first 120ms)
  tripleSpread: 0.2,     // rad between the three shells of a triple shot
  tripleShots: 3,        // triple shots per pick-up
  shieldMs: 10000,       // a shield lasts this long, or until it stops one hit
  itemFirstMs: 5000,     // the first power-up appears this long into a round ...
  itemEveryMs: 7000,     // ... then another about this often
  maxItems: 3,           // power-ups lying around at once
  botAim: 0.07,          // rad of wobble in a bot's aim
  botReact: 0.45,        // seconds a bot takes to fire once lined up
  botBank: 0.4,          // chance a bot looks for a bank shot when it checks
  botDodge: 0.5,         // chance a bot backs away from a shell about to hit it
  board: "tank-wins",    // leaderboard name
};
// Power-ups: the letter is what lies in the maze and what a tank carries.
const POWERS = {
  L: { name: "Laser", color: "#ff3df2" },         // one shot: an instant beam that bounces
  T: { name: "Triple", color: "#ffb02e" },        // the next 3 shots fire three shells each
  S: { name: "Shield", color: "#36d6ff" },        // stops one hit
};
const BOT_NAMES = ["Rusty", "Bolt", "Tread", "Sarge", "Dent", "Clank", "Pinball", "Boomer"];
const COLORS = ["#ff5d5d", "#4dabff", "#ffd23f", "#3ddc97", "#c77dff", "#ff9f43", "#f78fb3", "#9ad1d4"];

// ── MAZE ────────────────────────────────────────────────────────────────────────────
// A maze is carved from a seed (the same seed gives every screen the same maze), then some inner
// walls are knocked out so there are loops to circle round. Walls are thin rectangles on the cell
// lines; shells fly along a path ray-cast against them.
if (new URLSearchParams(location.search).has("attract")) Object.assign(CONFIG, { cols: 7, rows: 4 }); // the preview video uses a smaller maze: bigger tanks on screen
const CS = CONFIG.cell, COLS = CONFIG.cols, ROWS = CONFIG.rows, WW = COLS * CS, WH = ROWS * CS, WT = 8;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
let maze = null;
/** h[r][c] = wall above cell (c, r); v[r][c] = wall left of cell (c, r). */
function makeMaze(seed) {
  const rnd = mulberry32(seed);
  const h = Array.from({ length: ROWS + 1 }, () => Array(COLS).fill(true)), v = Array.from({ length: ROWS }, () => Array(COLS + 1).fill(true));
  const seen = new Set(), stack = [[Math.floor(rnd() * COLS), Math.floor(rnd() * ROWS)]];
  seen.add(stack[0].join());
  while (stack.length) { // carve: a random walk that backs up at dead ends
    const [c, r] = stack[stack.length - 1];
    const next = [[c + 1, r], [c - 1, r], [c, r + 1], [c, r - 1]].filter(([x, y]) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !seen.has(x + "," + y));
    if (!next.length) { stack.pop(); continue; }
    const [x, y] = next[Math.floor(rnd() * next.length)];
    if (x !== c) v[r][Math.max(x, c)] = false; else h[Math.max(y, r)][c] = false;
    seen.add(x + "," + y); stack.push([x, y]);
  }
  for (let r = 1; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (rnd() < CONFIG.openness) h[r][c] = false;
  for (let r = 0; r < ROWS; r++) for (let c = 1; c < COLS; c++) if (rnd() < CONFIG.openness) v[r][c] = false;
  const rects = [];
  for (let r = 0; r <= ROWS; r++) for (let c = 0; c < COLS; c++) if (h[r][c]) rects.push({ x0: c * CS - WT / 2, y0: r * CS - WT / 2, x1: (c + 1) * CS + WT / 2, y1: r * CS + WT / 2 });
  for (let r = 0; r < ROWS; r++) for (let c = 0; c <= COLS; c++) if (v[r][c]) rects.push({ x0: c * CS - WT / 2, y0: r * CS - WT / 2, x1: c * CS + WT / 2, y1: (r + 1) * CS + WT / 2 });
  return { seed, h, v, rects, spawns: spawnCells(seed) };
}
function useMaze(seed) { if (maze && maze.seed === seed) return; maze = makeMaze(seed); renderFloor(); treads.length = scorch.length = 0; }
/** Can you drive straight from cell (c, r) to its neighbour (c + dc, r + dr)? */
function passable(c, r, dc, dr) {
  const x = c + dc, y = r + dr;
  if (x < 0 || y < 0 || x >= COLS || y >= ROWS) return false;
  return dc ? !maze.v[r][Math.max(x, c)] : !maze.h[Math.max(y, r)][c];
}
/** Spawn cells for up to maxSeats tanks, spread out across the maze (from the seed). */
function spawnCells(seed) {
  const rnd = mulberry32(seed ^ 0x5bd1e995), out = [[Math.floor(rnd() * COLS), Math.floor(rnd() * ROWS)]];
  while (out.length < CONFIG.maxSeats) {
    let best = null, bd = -1;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const d = Math.min(...out.map(([x, y]) => Math.abs(x - c) + Math.abs(y - r))) + rnd() * 1.5;
      if (d > bd) { bd = d; best = [c, r]; }
    }
    out.push(best);
  }
  return out.map(([c, r]) => ({ x: (c + 0.5) * CS, y: (r + 0.5) * CS, a: Math.round(Math.atan2(WH / 2 - (r + 0.5) * CS, WW / 2 - (c + 0.5) * CS) / (Math.PI / 2)) * (Math.PI / 2) }));
}
/** The path of something flying from (x, y) at angle a for len px, bouncing off walls.
 *  Returns points [{x, y, d}] where d is the distance flown when it gets there. */
function castPath(x, y, a, len, rad, maxBounce = 60) {
  let dx = Math.cos(a), dy = Math.sin(a), d = 0;
  const pts = [{ x, y, d: 0 }];
  for (let b = 0; b <= maxBounce && d < len; b++) {
    let best = len - d, axis = "";
    for (const w of maze.rects) {
      const x0 = w.x0 - rad, x1 = w.x1 + rad, y0 = w.y0 - rad, y1 = w.y1 + rad;
      let tx0 = -Infinity, tx1 = Infinity, ty0 = -Infinity, ty1 = Infinity;
      if (dx) { const a1 = (x0 - x) / dx, a2 = (x1 - x) / dx; tx0 = Math.min(a1, a2); tx1 = Math.max(a1, a2); } else if (x <= x0 || x >= x1) continue;
      if (dy) { const a1 = (y0 - y) / dy, a2 = (y1 - y) / dy; ty0 = Math.min(a1, a2); ty1 = Math.max(a1, a2); } else if (y <= y0 || y >= y1) continue;
      const tin = Math.max(tx0, ty0), tout = Math.min(tx1, ty1);
      if (tin >= -1e-6 && tin <= tout && tout > 1e-6 && tin < best) { best = Math.max(0, tin); axis = tx0 > ty0 ? "x" : "y"; }
    }
    x += dx * best; y += dy * best; d += best;
    pts.push({ x, y, d });
    if (!axis) break;
    if (axis === "x") dx = -dx; else dy = -dy;
  }
  return pts;
}
/** Where a path is after flying s px. */
function pointAt(pts, s) {
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    if (s <= b.d) { const k = b.d > a.d ? (s - a.d) / (b.d - a.d) : 0; return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k }; }
  }
  return pts[pts.length - 1];
}
/** Push a circle out of every wall it overlaps. */
function collideWalls(o, rad) {
  for (let pass = 0; pass < 2; pass++) for (const w of maze.rects) {
    const cx = Math.max(w.x0, Math.min(w.x1, o.x)), cy = Math.max(w.y0, Math.min(w.y1, o.y)), dx = o.x - cx, dy = o.y - cy, d = Math.hypot(dx, dy);
    if (d >= rad) continue;
    if (d > 0.001) { o.x = cx + dx / d * rad; o.y = cy + dy / d * rad; }
    else { o.x += o.x < (w.x0 + w.x1) / 2 ? -(o.x - w.x0 + rad) : w.x1 - o.x + rad; } // centre inside the wall: out the nearest side
  }
  o.x = Math.max(rad, Math.min(WW - rad, o.x)); o.y = Math.max(rad, Math.min(WH - rad, o.y));
}
/** True when nothing but floor lies between two points (for line of sight). */
function clearLine(ax, ay, bx, by) {
  const n = Math.ceil(Math.hypot(bx - ax, by - ay) / 6);
  for (let i = 1; i < n; i++) { const x = ax + (bx - ax) * i / n, y = ay + (by - ay) * i / n; if (maze.rects.some((w) => x > w.x0 && x < w.x1 && y > w.y0 && y < w.y1)) return false; }
  return true;
}
const cellOf = (x, y) => [Math.max(0, Math.min(COLS - 1, Math.floor(x / CS))), Math.max(0, Math.min(ROWS - 1, Math.floor(y / CS)))];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'ricochet-tanks',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const parsed = new Map();
/** A JSON value from state, parsed once per change (read-only: never mutate what this returns). */
function parseOnce(key, raw, fallback) {
  const c = parsed.get(key);
  if (c && c.raw === raw) return c.v;
  const v = parse(raw, fallback); parsed.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} };
const seenHb = new Map();
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
/** Still in the room and heard from within the seat grace time. */
const stillHere = (id) => id === net.sessionId || (!!S.entities.players[id] && performance.now() - (seenHb.get(id)?.at ?? -1e9) < CONFIG.seatGraceMs);

// ── TANKS ───────────────────────────────────────────────────────────────────────────
const TR = CONFIG.tankR;
function newTank(id) {
  return { id, name: "", color: "#ccc", x: WW / 2, y: WH / 2, a: 0, speed: 0, cd: 0, shots: 0, shotAt: -1e9, pw: "", pn: 0, shieldUntil: 0, sd: 0, dead: 0, kb: "", r: "", treadAt: 0, tx: 0, ty: 0 };
}
/** Put a tank on its spawn point for this round. */
function resetTank(t, m, seat) {
  useMaze(m.seed);
  const sp = maze.spawns[seat % maze.spawns.length];
  Object.assign(t, { x: sp.x, y: sp.y, a: sp.a, speed: 0, cd: 0.4, pw: "", pn: 0, shieldUntil: 0, sd: 0, dead: 0, kb: "", r: roundKey(m), tx: sp.x, ty: sp.y });
}
/** One step of a tank. ctl = { turn, drive: -1..1 } (tank controls), or { dir, mag } (point the way to go: thumb stick and bots). */
function stepTank(t, ctl, dt, others) {
  t.cd -= dt;
  let drive = ctl.drive || 0;
  if (ctl.dir != null) {

    const k = (now - toast.at) / 1200; ctx.globalAlpha = 1 - k; ctx.font = "900 15px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.lineWidth = 4; ctx.strokeStyle = "#000c";
    const p = toScreen(me.x, me.y), y = p.y - TR * view.s - 24 - k * 16;
    ctx.strokeText(toast.text, p.x, y); ctx.fillStyle = toast.color; ctx.fillText(toast.text, p.x, y); ctx.globalAlpha = 1;
  }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, dropped = false, announced = "", toast = null;
const startedAt = performance.now();
function hud(m) {
  const t = Date.now(), seated = m.seats.includes(me.id), wn = (id) => (id === me.id ? "You" : m.names[id] || nameOf(id));
  let msg = "";
  if (m.phase === "intro") msg = m.startAt - t > 400 ? `ROUND ${m.round}<small>New maze · first to ${CONFIG.winRounds}</small>` : "GO!";
  else if (m.phase === "fight" && t - (m.endsAt - CONFIG.roundMs) < 600) msg = "GO!";
  else if (m.phase === "end") msg = m.rw === "draw" ? `DRAW!<small>${m.out.length < m.seats.length ? "Time ran out." : "Nobody made it."}</small>` : m.rw === me.id ? "YOU TAKE IT!" : `${esc(wn(m.rw).toUpperCase())} TAKES IT`;
  else if (m.phase === "over" && t < m.endsAt - CONFIG.resultsMs + 1500) msg = m.winner === me.id ? "YOU WIN!" : `${esc(wn(m.winner).toUpperCase())} WINS!`;
  if (!ATTRACT && !msg && m.phase === "fight") {
    const left = m.endsAt - t, hurry = left < 10000 && !m.lastAt ? `Draw in ${Math.max(0, Math.ceil(left / 1000))}s. ` : ""; // the last 10 seconds of a round
    if (!seated) msg = `<small>${hurry}You're in next round. Watch this one!</small>`;
    else if (me.dead) msg = `<small>${me.kb === me.id ? "Your own shell got you!" : `${esc(wn(me.kb || "").replace(/^Tank$/, "Someone"))} got you.`} Last tank rolling takes the round.</small>`;
    else if (hurry) msg = `<small>${hurry}</small>`;
  }
  $("msg").innerHTML = msg;
  if (msg !== announced) { announced = msg; if (/GO!|TAKES IT|TAKE IT|WIN/.test(msg)) sfx(/GO!/.test(msg) ? "bell" : "win"); }
  if (ATTRACT) { for (const id of ["cards", "hint", "net"]) $(id).textContent = ""; return; }
  const list = tanks();
  $("cards").innerHTML = m.seats.filter((id) => !gone(id)).map((id) => {
    const f = list.find((a) => a.id === id), out = m.out.includes(id) || (f && f.dead), w = m.wins[id] || 0, pw = f && f.pw ? `<b class="pw" style="color:${POWERS[f.pw].color}">${f.pw}</b>` : "";
    return `<div class="pc ${out ? "out" : ""} ${id === me.id ? "me" : ""}" style="--c:${colorOf(id)}"><small>${esc(wn(id))}</small><span class="w">${"●".repeat(w)}${"○".repeat(Math.max(0, CONFIG.winRounds - w))}</span>${pw}</div>`;
  }).join("");
  $("hint").textContent = performance.now() - startedAt < 14000 ? (touchUI ? "Stick drives · FIRE shoots · shells bounce back at you · grab crates" : "↑↓ drive · ←→ turn · Space fire · shells bounce (and can hit you) · grab L laser, T triple, S shield") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the match" : ""}`;
  $("fire").hidden = $("stickHome").hidden = !touchUI || !seated;
  if (!$("stickHome").hidden) Object.assign($("stickHome").style, { left: "90px", top: H - (H > W ? 150 : 110) + "px" });
  const showOver = m.phase === "over" && t > m.endsAt - CONFIG.resultsMs + 1500; // "X WINS!" first, then the card
  $("over").hidden = !showOver;
  if (showOver) {
    $("overTitle").textContent = m.winner === me.id ? "You win!" : `${wn(m.winner)} wins!`;
    $("overSub").textContent = seated ? (m.winner === me.id ? `First to ${CONFIG.winRounds} rounds. Last tank rolling.` : "So close. Next match is yours.") : "";
    const ranking = [...m.seats].sort((a, b) => (m.wins[b] || 0) - (m.wins[a] || 0) || (m.kills[b] || 0) - (m.kills[a] || 0));
    $("results").innerHTML = ranking.map((id) => `<li class="${id === me.id ? "me" : ""}">${esc(id === me.id ? myName : m.names[id] || nameOf(id))}<span>${m.wins[id] || 0} round${m.wins[id] === 1 ? "" : "s"} · ${m.kills[id] || 0} KO</span></li>`).join("");
    $("next").textContent = `Next match in ${Math.max(0, Math.ceil((m.endsAt - t) / 1000))}s`;
    if (me.shownFor !== m.id) { me.shownFor = m.id; showBoard(m.winner === me.id); }
  }
}
function showBoard(won) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li class='note'>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li class='note'>Loading…</li>";
  (won ? board.submit(1, "inc").catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${e.score}</span></li>`).join("") : "<li class='note'>No wins yet. Be the first.</li>";
  }).catch(() => { list.innerHTML = "<li class='note'>Couldn't load the leaderboard.</li>"; });
}
$("again").onclick = () => { if (isHost()) host.again = true; else net.send("again", {}); };
let audio = null; // made on the first tap or key (browsers block sound before that)
function sfx(kind) {
  if (!audio || ATTRACT) return;
  const [f0, f1, dur, vol, type] = { shot: [520, 180, 0.08, 0.05, "square"], tick: [1500, 1100, 0.03, 0.02, "square"], laser: [1800, 200, 0.3, 0.06, "sawtooth"],
    die: [260, 40, 0.5, 0.12, "sawtooth"], boom: [120, 30, 0.5, 0.14, "sawtooth"], pick: [620, 1240, 0.15, 0.06, "triangle"], shield: [900, 300, 0.25, 0.07, "triangle"],
    bell: [880, 870, 0.4, 0.05, "sine"], win: [520, 1040, 0.5, 0.06, "triangle"] }[kind];
  const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(audio.destination); o.start(t); o.stop(t + dur);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (["arrowleft", "arrowright", "arrowup", "arrowdown", " "].includes(k)) e.preventDefault();
  try { audio ||= new AudioContext(); } catch {}
  if (!e.repeat) pressed.add(k);
  keys.add(k);
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
addEventListener("pointerdown", () => { try { audio ||= new AudioContext(); } catch {} }, { once: true });
// Touch: a thumb stick wherever the left thumb lands (point the way to drive), and Fire on the right. A mouse click fires too.
const thumb = { on: false, id: -1, x0: 0, y0: 0, dx: 0, dy: 0 };
cv.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  if (e.pointerType === "mouse") { if (e.button === 0) pressed.add("mouse"); return; }
  if (thumb.on) return;
  if (e.clientX > innerWidth * 0.6) { pressed.add("pad:fire"); return; }
  Object.assign(thumb, { on: true, id: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, dy: 0 });
  Object.assign($("stick").style, { left: e.clientX + "px", top: e.clientY + "px" }); $("stick").hidden = false;
});
cv.addEventListener("contextmenu", (e) => e.preventDefault());
cv.addEventListener("pointermove", (e) => {
  if (!thumb.on || e.pointerId !== thumb.id) return;
  let dx = e.clientX - thumb.x0, dy = e.clientY - thumb.y0; const d = Math.hypot(dx, dy);
  if (d > 50) { dx *= 50 / d; dy *= 50 / d; }
  thumb.dx = dx; thumb.dy = dy; $("stick").firstChild.style.transform = `translate(${dx}px, ${dy}px)`;
});
for (const ev of ["pointerup", "pointercancel"]) addEventListener(ev, (e) => { if (thumb.on && e.pointerId === thumb.id) { thumb.on = false; thumb.dx = thumb.dy = 0; $("stick").hidden = true; } });
const fireBtn = $("fire");
fireBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); pressed.add("pad:fire"); fireBtn.classList.add("on"); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) fireBtn.addEventListener(ev, () => fireBtn.classList.remove("on"));
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastReal = performance.now(), lastHb = 0, lastHud = 0, fxKey = "", hostHoldUntil = 0, wokeAt = -1, stateAt = 0;
function frame(now) {
  requestAnimationFrame(frame); // first, so one error can't stop the game
  const real = performance.now(); // (the frame's own timestamp can be from before a long freeze ended)
  if (real - lastReal > 1000) { host.acting = false; host.last = null; wokeAt = real; } // woke from a freeze or a background tab: someone else may have run the match meanwhile, so wait for fresh state and adopt it (never write our stale copy)
  lastReal = real;
  if (wokeAt >= 0 && stateAt > wokeAt) { hostHoldUntil = stateAt + 700; wokeAt = -1; }      // fresh state arrived: host again (if still lowest) 700ms later
  let dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // never negative: the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost() && wokeAt < 0 && real >= hostHoldUntil && !dropped) hostTick(dt, real); else host.acting = false;
  const m = match();
  if (!m) return;
  useMaze(m.seed);
  if (fxKey !== roundKey(m)) { fxKey = roundKey(m); shells.length = 0; pending.clear(); }
  syncViews(dt, m);
  myTick(dt, m);
  stepShells(m);
  stepFx(dt);
  draw(m, real);
  if (now - lastHud > 100) { lastHud = now; hud(m); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; stateAt = performance.now(); });
  net.on("shot", (msg, from) => {
    const m = match();
    if (!msg || !m || msg.r !== roundKey(m) || !Array.isArray(msg.s)) return;
    useMaze(m.seed);
    const by = typeof msg.by === "string" ? msg.by : from;
    for (const s of msg.s.slice(0, 3)) if (Array.isArray(s) && typeof s[1] === "number") addShell(s, by, msg.r);
  });
  net.on("pop", (msg) => { const s = shells.find((x) => x.id === msg?.id); if (s && !s.gone) { s.gone = true; if (typeof msg.x === "number") spark(msg.x, msg.y, "#fff", 8); } });
  net.on("pick", (msg, from) => { if (host.acting && msg && msg.r === host.items.r) hostPick(from, msg.id); });
  net.on("got", (msg) => { if (msg && msg.to === me.id && msg.r === roundKey(match())) gainPower(me, String(msg.k)); });
  net.on("again", () => { if (host.acting) host.again = true; });
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...parse(S.shared.bots, []).map((b) => b.c)]);
  me.id = net.sessionId; me.color = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: me.color, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { seats: 5, winRounds: 3, introMs: 700, endMs: 1300, resultsMs: 1500, lastStandMs: 900, roundMs: 30000, itemFirstMs: 600, itemEveryMs: 2500, botReact: 0.12, botBank: 0.85, botDodge: 0.6 });
  last = lastReal = performance.now(); // joining can take a few seconds: that's not a freeze
  requestAnimationFrame(frame);
})();
</script>
